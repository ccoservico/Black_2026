<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: black;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source src="tv1/TV1.mp4" type="video/mp4">

        Seu navegador não suporta reprodução de vídeo.

    </video>

    <script>
        const video = document.getElementById("video");

        // Garante que o vídeo fique em loop
        video.loop = true;

        // Garante que esteja sem áudio para permitir reprodução automática
        video.muted = true;

        // Tenta iniciar automaticamente
        function iniciarVideo() {
            video.play().catch(function () {
                console.log("Aguardando permissão do navegador para iniciar o vídeo.");
            });
        }

        // Inicia ao carregar a página
        window.addEventListener("load", function () {
            iniciarVideo();
        });

        // Se o vídeo parar por algum motivo, tenta iniciar novamente
        video.addEventListener("pause", function () {
            iniciarVideo();
        });

        // Se chegar ao fim, volta para o começo
        video.addEventListener("ended", function () {
            video.currentTime = 0;
            iniciarVideo();
        });

        // Se a aba voltar a ficar ativa, garante que continua rodando
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) {
                iniciarVideo();
            }
        });
    </script>

</body>
</html>
