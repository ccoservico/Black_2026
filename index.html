<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TV 1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>

<body>

    <video
        id="videoTV"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
            src="TV1.mp4"
            type="video/mp4">

        Seu navegador não suporta vídeo HTML5.

    </video>

    <script>
        const video = document.getElementById("videoTV");

        video.muted = true;
        video.loop = true;

        video.addEventListener("canplay", function () {
            video.play().catch(function (erro) {
                console.log("Autoplay bloqueado:", erro);
            });
        });

        video.addEventListener("ended", function () {
            video.currentTime = 0;
            video.play();
        });
    </script>

</body>
</html>
